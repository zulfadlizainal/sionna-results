<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Technical Report</title>
  <link rel="stylesheet" href="journal.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div class="page-header">
    <span class="header-left" id="header-title">Technical Report</span>
    <span class="header-right">Confidential Draft · 2026</span>
  </div>

  <div id="content"></div>

  <div class="page-footer">
    <span>© 2026 The Authors. All rights reserved.</span>
    <span id="footer-repo"></span>
  </div>

  <script>
    marked.setOptions({ breaks: true });

    fetch('report.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);

        const h1 = document.querySelector('.paper-title');
        if (h1) document.getElementById('header-title').textContent = h1.textContent;

        const repoMatch = md.match(/<!--\s*repo:\s*(.+?)\s*-->/);
        if (repoMatch) document.getElementById('footer-repo').textContent = repoMatch[1];
      });
  </script>
</body>
</html>
